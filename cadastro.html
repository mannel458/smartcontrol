<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CADASTRO SMART CONTROL</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>

<body>

    <div class="container">

        <form action="index.html" method="get">

            <div class="card">

                <h1>CADASTRO</h1>

                <div class="input-group">

                    <label for="nome_completo">NOME COMPLETO</label>
                    <input
                        type="text"
                        name="nome_completo"
                        id="nome_completo"
                        placeholder="Digite seu nome completo"
                        required
                    >

                    <label for="e_mail">E-MAIL</label>
                    <input
                        type="email"
                        name="e_mail"
                        id="e_mail"
                        placeholder="Digite seu E-mail"
                        required
                    >

                    <label for="senha">SENHA</label>
                    <input
                        type="password"
                        name="senha"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="8"
                        required
                    >

                </div>

                <div class="termos">

                    <input
                        type="checkbox"
                        name="termos_de_uso"
                        id="termos_de_uso"
                        required
                    >

                    <label for="termos_de_uso">
                        Aceito todos os termos de uso
                    </label>

                </div>

                <button type="submit">
                    CADASTRAR
                </button>

            </div>

        </form>

    </div>

    <footer>
    </footer>

    <script src="assets/js/main.js"></script>

</body>

</html>
