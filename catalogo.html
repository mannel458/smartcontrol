<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="assets/css/catalogo.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>VEÍCULOS</h1>
        </div>

        <div class="carros">

            <h1>CATÁLOGO</h1>
            <h3>Confira os veículos disponíveis</h3>

            <div class="catalogo">

                <div class="card1">
                    <img src="assets/imagens/carro1.jpg" alt="Carro 1">
                    <h4>Volkswagen Jetta</h4>
                    <p>Descrição do carro 1</p>
                </div>

                <div class="card2">
                    <img src="assets/imagens/carro2.jpg" alt="Carro 2">
                    <h4>MW R 1200 GS</h4>
                    <p>Descrição do carro 2</p>
                </div>

                <div class="card3">
                    <img src="assets/imagens/carro3.jpg" alt="Carro 3">
                    <h4>Toyota Corolla</h4>
                    <p>Descrição do carro 3</p>
                </div>

                <div class="card4">
                    <img src="assets/imagens/carro4.jpg" alt="Carro 4">
                    <h4>Honda CG 160 Titan</h4>
                    <p>Descrição do carro 4</p>
                </div>

            </div>

            <div class="Voltar">
                <a href="index.html">Voltar</a>
            </div>

            <div class="Gerenciamento">
                <button type="button">+ GERENCIAMENTO DE VENDAS</button>
            </div>

            <div class="Atualizar">
                <button type="button">ATUALIZAR VEÍCULOS</button>
            </div>

            <div class="Excluir">
                <button type="button" onclick="excluirVeiculo()">EXCLUIR VEÍCULO</button>

                <input
                    type="text"
                    id="excluir_veiculos"
                    placeholder="Digite o nome do veículo que deseja excluir"
                >
            </div>

        </div>

    </div>

    <script>
        function excluirVeiculo() {
            const nome = document.getElementById("excluir_veiculos").value.trim().toLowerCase();

            const cards = document.querySelectorAll(".catalogo > div");

            if (nome === "") {
                alert("Digite o nome do veículo.");
                return;
            }

            let encontrado = false;

            cards.forEach(card => {
                const titulo = card.querySelector("h4").textContent.trim().toLowerCase();

                if (titulo === nome) {
                    card.remove();
                    encontrado = true;
                }
            });

            if (encontrado) {
                alert("Veículo excluído com sucesso.");
                document.getElementById("excluir_veiculos").value = "";
            } else {
                alert("Veículo não encontrado.");
            }
        }
    </script>

</body>
</html>
