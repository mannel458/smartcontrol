<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/style.css">

    <title>Smart Control</title>
</head>

<body>

    <!-- Logo -->
    <!--<div class="logo">
        <img src="assets/images/download (1).png" alt="imagem logo">
    </div>-->

    <div class="container">

        <div class="card">

            <h1>BEM VINDO!!</h1>

            <form action="dashboard.html" method="get">

                <div class="input-group">

                    <label for="e_mail">E-mail</label>
                    <br>

                    <input 
                        type="email" 
                        name="e_mail" 
                        id="e_mail" 
                        placeholder="Digite seu E-mail aqui" 
                        required
                    >

                    <br><br>

                    <label for="senha">Senha</label>
                    <br>

                    <input 
                        type="password" 
                        name="senha" 
                        id="senha" 
                        placeholder="Digite sua senha aqui" 
                        minlength="8" 
                        required
                    >

                    <br><br>

                </div>

                <div class="lembrar">

                    <input 
                        type="checkbox" 
                        name="lembrar" 
                        id="lembrar"
                    >

                    <label for="lembrar">Lembrar-me</label>

                    <br><br>

                </div>

                <button type="submit" name="login">
                    Entrar
                </button>

                <br><br>

            </form>

            <div class="rodape_login">

                <a href="cadastro.html">
                    Não tenho cadastro
                </a>

                <a href="esqueci_senha.html">
                    Esqueci minha senha
                </a>

            </div>

        </div>

    </div>
